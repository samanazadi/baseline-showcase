<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1" name="viewport">
    <title>details-content</title>
    <style>
        body {
            font-family: sans-serif;
        }

        details {
            border: 1px solid #ccc;
            border-radius: 8px;
            max-width: 500px;
        }

        summary {
            padding: 0.75rem 1rem;
            cursor: pointer;
            user-select: none;
        }

        details[open]::details-content {
            padding: 1rem;
            border-left: 4px solid #9ca3af;
            background-color: #f3f4f6;
            color: #374151;
            border-radius: 0 0 8px 8px;
        }
    </style>
</head>
<body>
<details>
    <summary>System Requirements</summary>
    <p>
        Requires a computer running an operating system. The computer must have some memory and ideally some kind of
        long-term storage. An input device as well as some form of output device is recommended.
    </p>
</details>
</body>
</html>
