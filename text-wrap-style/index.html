<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>text-wrap-style</title>
    <style>
        body {
            font-family: sans-serif;
            padding: 1rem;
        }

        .row {
            display: flex;
            gap: 1rem;
        }

        .box {
            width: 200px;
            border: 1px solid #ccc;
            padding: 0.5rem;
        }

        h2 {
            text-align: center;
            margin-bottom: 0;
        }

        .auto {
            text-wrap-style: auto;
        }

        .balance {
            text-wrap-style: balance;
        }
    </style>
</head>
<body>
<div class="row">
    <div>
        <h2>auto</h2>
        <p class="box auto">Lorem ipsum dolor sit amet consectetur adipisicing elit. Voluptatem aut cum eum id quos
            est.</p>
    </div>
    <div>
        <h2>balance</h2>
        <p class="box balance">Lorem ipsum dolor sit amet consectetur adipisicing elit. Voluptatem aut cum eum id quos
            est.</p>
    </div>
</div>
</body>
</html>
